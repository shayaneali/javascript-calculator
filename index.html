<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="css/style.css">

</head>
<body>

    <div class="contain">
        <div class="theme-row"><button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️ Light</button> <button class="theme-btn" id="helpBtn" onclick="openHelp()" aria-label="Keyboard shortcuts help">? Help</button></div>
        <div class="in-cont" id="display"></div>
        <div class="history-row"><button class="history-btn" id="historyBtn" onclick="toggleHistory()">Hide history</button> <button class="history-btn" id="copyHistoryBtn" onclick="copyHistory()">Copy history</button> <button class="history-btn" id="clearHistoryBtn" onclick="clearHistory()">Clear history</button></div>
        <div class="history" id="history" title="Last 5 calculations"></div>
        <div class="copy-row"><button class="copy-btn" id="copyBtn" onclick="copyResult()">COPY</button></div>

        <div class="btns">
            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button onclick="press('/')">/</button>

            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button onclick="press('*')">*</button>

            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button onclick="press('-')">-</button>

            <button onclick="press('0')">0</button>
            <button onclick="press('.')">.</button>
            <button onclick="calculate()">=</button>
            <button onclick="press('+')">+</button>
            
            
             <button onclick="percentDisplay()">%</button>
             <button onclick="toggleSign()">+/-</button>
             <button onclick="press('^')">^</button>
             <button onclick="sqrtDisplay()">√</button>
             <button onclick="squareDisplay()">x²</button>
             <button onclick="cubeDisplay()">x³</button>
             <button onclick="pow10Display()">10ˣ</button>
             <button onclick="reciprocalDisplay()">1/x</button>
             <button onclick="pressPi()" aria-label="Pi">π</button>
           
             <button onclick="removeChar()" class="backspace-btn" aria-label="Backspace">⌫</button>

             <button onclick="memoryClear()">MC</button>
             <button onclick="memoryRecall()">MR</button>
             <button onclick="memoryAdd()">M+</button>
             <button onclick="memorySubtract()">M-</button>

             <button onclick="clearDisplay()" class="clear-btn">CLEAR</button>



        </div>
    </div>

    <!-- keyboard shortcuts help modal -->
    <div class="modal-overlay hidden" id="helpModal" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
        <div class="modal">
            <button class="modal-close" onclick="closeHelp()" aria-label="Close help">×</button>
            <h2 id="helpTitle">Keyboard shortcuts</h2>
            <table class="shortcuts">
                <tr><td><kbd>0</kbd>–<kbd>9</kbd>, <kbd>.</kbd></td><td>Type digits and decimal point</td></tr>
                <tr><td><kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd></td><td>Operators</td></tr>
                <tr><td><kbd>^</kbd></td><td>Power</td></tr>
                <tr><td><kbd>%</kbd></td><td>Percent</td></tr>
                <tr><td><kbd>Enter</kbd> or <kbd>=</kbd></td><td>Calculate</td></tr>
                <tr><td><kbd>Backspace</kbd></td><td>Delete last character</td></tr>
                <tr><td><kbd>Esc</kbd></td><td>Clear display</td></tr>
                <tr><td><kbd>?</kbd></td><td>Open this help</td></tr>
            </table>
        </div>
    </div>

    <script src="js/script.js"></script>


</body>
</html>
